name: Update wallpaper

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC = 00:00 en America/Punta_Arenas while UTC-3
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate wallpaper
        run: python generate_skull_calendar.py

      - name: Publish updated wallpaper
        run: |
          cp skull_live_calendar.png wallpaper.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wallpaper.png
          git diff --cached --quiet || git commit -m "Update wallpaper"
          git push
