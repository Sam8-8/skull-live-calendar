          git pushnombreActualizar fondo de pantalla

en:
  flujo de trabajo_despacho:
  cronograma:
    # 03:00 UTC = 00:00 en América/Punta_Arenas mientras que UTC-3
    - cron: '0 3 * * *'

permisos:
  contenidos: escribir

empleo:
  actualizar:
    run-on: ubuntu-último
    pasos:
      - nombre: Checkout
        usos: acciones/checkout@v5

      - nombre: Configurar Python
        usos: acciones/setup-python@v6
        con:
          versión python: '3.x'

      - nombre: Instalar almohada
        run: python -m pip instalar almohada

      - nombre: Generar fondo de pantalla
        run: python generate_skull_calendar.py

      - nombre: Publicar fondo de pantalla actualizado
        run: |
          cp skull_live_calendar.png fondo de pantalla.png
          git config nombre de usuario 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git agrega fondo de pantalla.png
          git diff --cached --quiet || git commit -m "Actualizar fondo de pantalla"
          git push
